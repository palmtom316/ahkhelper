; ScreenPlus 配置文件（模板）
; 默认运行时写入 %AppData%\ScreenPlus\screen.ini（便携模式：脚本旁 portable.flag）
; 与 modules/Config.ahk DefaultMap 对齐

[General]
AppName=ScreenPlus
ShowStartupTip=1
StartupTipMs=2000

[VirtualDesktop]
Enabled=1
UseDll=1
DllPath=
MaxDesktops=9
HotkeyDesktops=3
; off=无 DLL 时禁用 VD（推荐）；simulate=键盘盲切
FallbackMode=off

[AutoCopy]
Enabled=1
DelayMs=120
ClipWaitTimeout=0.5
RetryCount=1
RetryDelayMs=80
MinDragPixels=8
ShowTip=1
TipMs=800
FilterMode=whitelist
WaitForAnyData=0
ActivateTarget=0

[WindowFilter]
Whitelist=WINWORD.EXE,EXCEL.EXE,POWERPNT.EXE,Code.exe,Obsidian.exe,Typora.exe,notepad++.exe,chrome.exe,msedge.exe,firefox.exe,Acrobat.exe,FoxitPDFReader.exe,WeChat.exe
Blacklist=

[Clipboard]
HistoryMax=30
HistoryItemMaxKb=512
HistoryTotalMaxMb=8
MaxSnapshotMb=64
LogOperations=1

[Logger]
Enabled=1
; 留空=自动 %LocalAppData%\ScreenPlus\logs 或便携 logs\
LogDir=
Level=INFO
MaxFileKb=1024

[Tray]
Tooltip=ScreenPlus
ShowAutoCopyToggle=1
ShowClipboardHistory=1
HistoryPreviewCount=5

[ToolTip]
DefaultMs=1500
Position=mouse

[Plugin_Example]
Enabled=0
